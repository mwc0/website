<svg xmlns="http://www.w3.org/2000/svg">
  <!-- One stroke weight (1.5), round caps and joins, 24px box. The stroke and
       colour come from .icon in style.css; only filled parts set their own. -->

  <symbol id="i-mark" viewBox="0 0 24 24">
    <path d="M12 2.5 21 21.5 12 17.2 3 21.5Z" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="i-snake" viewBox="0 0 24 24">
    <path d="M20 6H9.75a3.25 3.25 0 0 0 0 6.5h4.5a3.25 3.25 0 0 1 0 6.5H9"/>
    <rect x="2.75" y="17.5" width="3" height="3" rx="0.9" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="i-wordle" viewBox="0 0 24 24">
    <rect x="2.25" y="9" width="5.5" height="6" rx="1.4"/>
    <rect x="9.25" y="9" width="5.5" height="6" rx="1.4" fill="currentColor"/>
    <rect x="16.25" y="9" width="5.5" height="6" rx="1.4"/>
  </symbol>

  <symbol id="i-tunnel" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="4.5"/>
    <rect x="7.5" y="7.5" width="9" height="9" rx="2.5"/>
    <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="i-convert" viewBox="0 0 24 24">
    <path d="M4 8.25h15M15.5 4.75l3.5 3.5-3.5 3.5"/>
    <path d="M20 15.75H5M8.5 12.25 5 15.75l3.5 3.5"/>
  </symbol>

  <symbol id="i-epoch" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 7.25V12l3.25 2"/>
  </symbol>

  <symbol id="i-base" viewBox="0 0 24 24">
    <path d="M7.75 4.5H6.5A1.75 1.75 0 0 0 4.75 6.25v11.5A1.75 1.75 0 0 0 6.5 19.5h1.25"/>
    <path d="M16.25 4.5h1.25a1.75 1.75 0 0 1 1.75 1.75v11.5a1.75 1.75 0 0 1-1.75 1.75h-1.25"/>
    <path d="M9.75 9v6"/>
    <rect x="12.5" y="9" width="3" height="6" rx="1.5"/>
  </symbol>

  <symbol id="i-colour" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="M5 12h14M13.25 6.25 19 12l-5.75 5.75"/>
  </symbol>

  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M7 7l10 10M17 7 7 17"/>
  </symbol>
</svg>
